<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard | EduWorkflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body data-role="teacher">
  <div class="dashboard-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-lockup">
        <div class="brand-mark">EW</div>
        <div>
          <div class="brand-name">EduWorkflow</div>
          <div class="brand-subtitle">Faculty Portal</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-link active" data-target="overviewSection">Home</button>
        <button class="nav-link" data-target="operationsSection">Class Operations</button>
        <button class="nav-link" data-target="rosterSection">Roster</button>
        <button class="nav-link" data-target="timetableSection">Timetable</button>
        <button class="nav-link" data-target="announcementsSection">Notices</button>
        <button class="nav-link" data-target="profileSection">Profile</button>
      </nav>
      <div class="sidebar-footer">
        <div class="identity-card">
          <div class="avatar" id="sidebarAvatar">TR</div>
          <div>
            <div class="identity-name" id="sidebarName">Faculty</div>
            <div class="identity-meta" id="sidebarMeta">Department</div>
          </div>
        </div>
        <button class="ghost-btn full-width" id="logoutBtn">Sign Out</button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <div class="eyebrow">Faculty operations</div>
          <h1 class="page-title" id="pageTitle">Faculty Portal</h1>
          <p class="page-subtitle" id="pageSubtitle">Loading teaching records...</p>
        </div>
        <div class="topbar-meta">
          <button class="icon-btn mobile-only" id="menuToggleBtn" title="Open menu">Menu</button>
          <div class="clock-chip" id="liveClock">--</div>
          <button class="icon-btn" id="refreshBtn" title="Refresh data">Refresh</button>
        </div>
      </header>

      <section id="overviewSection" class="view-section"></section>
      <section id="operationsSection" class="view-section hidden"></section>
      <section id="rosterSection" class="view-section hidden"></section>
      <section id="timetableSection" class="view-section hidden"></section>
      <section id="announcementsSection" class="view-section hidden"></section>
      <section id="profileSection" class="view-section hidden"></section>
    </main>
  </div>
  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <div id="toastContainer" class="toast-stack"></div>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
